[runtime]
owner = "owner"
profile = "booster_k1"
database = "/var/lib/orbo/k1-journal.db"
socket = "/run/orbo-k1/runtime.sock"

[robot]
id = "booster-k1"
socket = "/var/lib/orbo/k1-bridge/worker.sock" # Owner-private SSH-forwarded on-K1 socket.
qualified = false
allowed_actions = ["hand_wave"] # Candidate only. Both ends must explicitly commission it.
attention_action = "hand_wave"

[near]
enabled = false # Enable verified NEAR text reasoning explicitly.
model = "z-ai/glm-5.3-flash"

# For OpenAI Live voice, configure the embodied runtime and its [live] section.
# See deploy/profiles/embodied.toml and deploy/audio/README.md.
