[workspace]
name = "little-orbo-ros"
description = "Native macOS ROS 2 Jazzy development with RoboStack"
requires-pixi = ">=0.84.2"
channels = ["https://prefix.dev/robostack-jazzy"]
platforms = [{ name = "macos-arm64", platform = "osx-arm64", macos = "14.0" }]

[dependencies]
python = "3.12.*"
pytest = ">=8.4,<9"
ros-jazzy-desktop = "*"
ros-dev-tools = "*"
ros-jazzy-ros2-control = ">=4.49.0,<5"
ros-jazzy-ros2-controllers = ">=4.43.0,<5"
ros-jazzy-xacro = ">=2.1.1,<3"
ros-jazzy-nav2-bringup = ">=1.3,<2"
ros-jazzy-joy = ">=3.3,<4"
ros-jazzy-gz-ros2-control = ">=1.2.20,<2"
ros-jazzy-ros-gz-sim = ">=1.0,<2"
ros-jazzy-ros-gz-bridge = ">=1.0,<2"
gz-sim8 = ">=8.10,<9"
gz-transport13-python = ">=13.5,<14"
gz-msgs10-python = ">=10.3,<11"

[pypi-dependencies]
orbo-runtime = { path = ".", editable = true }
pytest-asyncio = "==1.2.0"

# Fast DDS 2.14 shared-memory recovery can block native Mac publishers.
# Keep DDS reliability/QoS unchanged while using its UDP transport.
[activation.env]
FASTDDS_BUILTIN_TRANSPORTS = "UDPv4"
# Jazzy LOCALHOST discovery injects SHM again, bypassing the setting above.
ROS_AUTOMATIC_DISCOVERY_RANGE = "SUBNET"

[tasks]
ros-build-simulation = "colcon --log-base ros_ws/log/macos build --base-paths ros_ws/src --build-base ros_ws/build/macos --install-base ros_ws/install/macos --packages-select orbo_description orbo_simulation"
orbo-sim = { cmd = "bash tools/run-orbo-sim.sh", depends-on = ["ros-build-simulation"] }
orbo-sim-goal = "bash tools/run-orbo-sim.sh goal"
orbo-sim-drive = "bash tools/run-orbo-sim.sh drive"
ros-test-simulation = { cmd = "bash tools/run-orbo-sim.sh test", depends-on = ["ros-build-simulation"] }
ros-check = "python tools/check-ros-macos.py"
ros-talker = "ros2 run demo_nodes_cpp talker"
ros-listener = "ros2 run demo_nodes_py listener"
rviz = "rviz2"
ros-build-description = "colcon --log-base ros_ws/log/macos build --base-paths ros_ws/src --build-base ros_ws/build/macos --install-base ros_ws/install/macos --packages-select orbo_description"
orbo-preview = { cmd = "bash -c 'source ros_ws/install/macos/local_setup.bash && python tools/preview-orbo-macos.py'", depends-on = ["ros-build-description"] }
ros-build-interfaces = "colcon --log-base ros_ws/log/macos build --base-paths ros_ws/src --build-base ros_ws/build/macos --install-base ros_ws/install/macos --packages-select orbo_embedded_interfaces"

ros-build-control = "colcon --log-base ros_ws/log/macos build --base-paths ros_ws/src --build-base ros_ws/build/macos --install-base ros_ws/install/macos --packages-select orbo_embedded_interfaces orbo_hardware orbo_description orbo_runtime orbo_bringup --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo"
ros-control = "bash tools/run-control-macos.sh"
ros-base-keyboard = "bash -c 'source ros_ws/install/macos/local_setup.bash && ros2 run orbo_runtime base_bench keyboard'"
ros-base-drive = "bash -c 'source ros_ws/install/macos/local_setup.bash && ros2 run orbo_runtime base_bench drive --linear 0.02 --seconds 30'"
rviz-live = "bash -c 'source ros_ws/install/macos/local_setup.bash && python tools/preview-orbo-macos.py --live'"
rviz-pi = { cmd = "bash -c 'source ros_ws/install/macos/local_setup.bash && exec python tools/preview-orbo-macos.py --pi \"$@\"' --", depends-on = ["ros-build-description"] }
ros-test-control = "bash -c 'source ros_ws/install/macos/local_setup.bash && python firmware/orbo/host_tests/test_control_wheels.py && python firmware/orbo/host_tests/test_base_control.py && ROS_DOMAIN_ID=96 ORBO_ROS_TESTS=1 python -m pytest -q tests/ros/test_base_stack.py tests/ros/test_hardware_plugin.py tests/ros/test_process_cleanup.py'"

ros-test-control-repeat = "bash -c 'source ros_ws/install/macos/local_setup.bash && ROS_DOMAIN_ID=97 ORBO_TEST_DOMAIN=97 ORBO_ROS_TESTS=1 ORBO_CONTROL_REPEATS=5 python -m pytest -q tests/ros/test_base_stack.py::test_30_second_odometry_uses_feedback_not_command'"

ros-build-workspace = "colcon --log-base ros_ws/log/macos build --base-paths ros_ws/src --build-base ros_ws/build/macos --install-base ros_ws/install/macos --packages-select orbo_embedded_interfaces orbo_hardware orbo_description orbo_runtime orbo_bringup orbo_navigation --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo"
ros-test-integrations = "bash -c 'source ros_ws/install/macos/local_setup.bash && ROS_DOMAIN_ID=96 ORBO_ROS_TESTS=1 python -m pytest -q tests/ros/test_launch_integration.py tests/ros/test_peripheral_topics.py tests/ros/test_navigation_adapter.py tests/ros/test_python_workspace.py tests/test_runtime_install.py'"
