[workspace]
name = "little-orbo-ros"
description = "Native macOS ROS 2 Jazzy development with RoboStack"
requires-pixi = ">=0.84.2"
channels = ["https://prefix.dev/robostack-jazzy"]
platforms = [{ name = "macos-arm64", platform = "osx-arm64", macos = "14.0" }]

[dependencies]
python = "3.12.*"
ros-jazzy-desktop = "*"
ros-dev-tools = "*"
ros-jazzy-ros2-control = ">=4.49.0,<5"
ros-jazzy-ros2-controllers = ">=4.43.0,<5"
ros-jazzy-xacro = ">=2.1.1,<3"

[tasks]
ros-check = "python tools/check-ros-macos.py"
ros-talker = "ros2 run demo_nodes_cpp talker"
ros-listener = "ros2 run demo_nodes_py listener"
rviz = "rviz2"
ros-build-description = "colcon --log-base ros_ws/log/macos build --base-paths ros_ws/src --build-base ros_ws/build/macos --install-base ros_ws/install/macos --packages-select orbo_description"
orbo-preview = { cmd = "bash -c 'source ros_ws/install/macos/local_setup.bash && python tools/preview-orbo-macos.py'", depends-on = ["ros-build-description"] }
ros-build-interfaces = "colcon --log-base ros_ws/log/macos build --base-paths ros_ws/src --build-base ros_ws/build/macos --install-base ros_ws/install/macos --packages-select orbo_embedded_interfaces"

ros-build-control = "colcon --log-base ros_ws/log/macos build --base-paths ros_ws/src --build-base ros_ws/build/macos --install-base ros_ws/install/macos --packages-select orbo_embedded_interfaces orbo_hardware orbo_description orbo_bringup --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo"
ros-control = "bash tools/run-control-macos.sh"
ros-base-keyboard = "bash -c 'source ros_ws/install/macos/local_setup.bash && python tools/control-base.py keyboard'"
ros-base-drive = "bash -c 'source ros_ws/install/macos/local_setup.bash && python tools/control-base.py drive --linear 0.02 --seconds 30'"
rviz-live = "bash -c 'source ros_ws/install/macos/local_setup.bash && python tools/preview-orbo-macos.py --live'"
ros-test-control = "bash -c 'source ros_ws/install/macos/local_setup.bash && python firmware/orbo/host_tests/test_control_wheels.py && python firmware/orbo/host_tests/test_base_control.py && ROS_DOMAIN_ID=96 ORBO_ROS_TESTS=1 python -m pytest -q tests/ros/test_base_stack.py tests/ros/test_hardware_plugin.py'"
