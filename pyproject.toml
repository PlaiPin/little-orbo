[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "orbo-runtime"
version = "0.1.0"
description = "Pi-native Orbo coordinator, robot and provider integrations"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx==0.28.1",
    "jsonschema==4.25.1",
    "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
local-commons = ["cryptography==50.0.2"]
near = ["nearai-inference-sdk==0.3.0"]
intents = ["PyNaCl==1.6.2"]
audio = ["sounddevice==0.5.3"]
live = ["websockets>=15,<16", "sounddevice==0.5.3"]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.5"]

[project.scripts]
orbo = "orbo_runtime.cli:main"
orbo-teleop-keyboard = "orbo_runtime.teleop_keyboard:main"
orbo-audio-check = "orbo_runtime.audio_check:main"
orbo-camera-monitor = "orbo_runtime.camera:main"
orbo-velocity-gate = "orbo_runtime.velocity_gate:main"

[tool.hatch.build.targets.sdist]
include = ["ros_ws/src/orbo_runtime", "packages/orbo_runtime/README.md", "pyproject.toml", "uv.lock", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["ros_ws/src/orbo_runtime/orbo_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
